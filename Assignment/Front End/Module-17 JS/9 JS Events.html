<!-- 9. JavaScript Events  
Lab Assignment  
 Task: 
o Create a simple webpage with a button that, when clicked, displays an alert saying 
"Button clicked!" using JavaScript event listeners.  -->


<!DOCTYPE html>
<html>
<head>
  <title>Event Example</title>
</head>
<body>

  <h2>JavaScript Event Demo</h2>
  
  <button id="myButton">Click Me</button>

  <script>
    // Select button
    let btn = document.getElementById("myButton");

    // Add event listener
    btn.addEventListener("click", function() {
      alert("Button clicked!");
    });
  </script>

</body>
</html>
