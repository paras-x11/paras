<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submissions | Swan Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-gradient">
  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold"><i class="bi bi-arrow-left"></i> Back</a>
      <div class="d-flex gap-2">
        <button id="exportBtn" class="btn btn-light btn-sm"><i class="bi bi-download"></i> Export</button>
        <label class="btn btn-outline-light btn-sm mb-0">
          <i class="bi bi-upload"></i> Import
          <input type="file" id="importFile" accept="application/json" hidden>
        </label>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="card shadow-lg glass-card">
      <div class="card-body p-4">
        <div class="d-flex flex-column flex-md-row gap-3 mb-3 align-items-md-end justify-content-between">
          <div>
            <h1 class="h4 m-0">Guest Submissions</h1>
            <p class="text-secondary small mb-0">Search by name or date. Delete records as needed.</p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="searchInput" type="search" class="form-control" placeholder="Search guest by name or email">
            </div>
            <input id="dateFilter" type="date" class="form-control" />
            <button id="resetFilters" class="btn btn-outline-secondary">Reset</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table align-middle table-hover" id="submissionsTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Aadhar</th>
                <th>Address</th>
                <th>Check-In</th>
                <th>Check-Out</th>
                <th>Adults</th>
                <th>Purpose</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="12" class="text-center text-secondary py-4">No data found</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

  <script type="module" src="./js/viewer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
