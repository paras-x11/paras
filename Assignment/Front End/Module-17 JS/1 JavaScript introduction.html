<!-- Lab Assignment  
 Task: 
o Create a simple HTML page and add a <script> tag within the page. 
o Write JavaScript code to display an alert box with the message "Welcome to 
JavaScript!" when the page loads.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to JS</title>
</head>
<body>
    <div class="container">
        <h1>Hello World!</h1>
    </div>

    <script>
        window.onload(alert("Welcome To JavaScript!"))
    </script>
</body>
</html>
