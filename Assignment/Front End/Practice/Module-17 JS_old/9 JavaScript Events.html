<!-- // Lab Assignment  
//  Task: 
// o Create a simple webpage with a button that, when clicked, displays an alert saying 
// "Button clicked!" using JavaScript event listeners.  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Events</title>
    <style>
        .container {
            display: flex;
            justify-content: center; /* horizontally center */
            align-items: center;
            height: 100px;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <button type="button" onclick="clickButton()">Click Me!</button>
        </h1>
    </div>
    <script>
        function clickButton(){
            alert('Button Clicked!')
        }
    </script>
</body>
</html>
